name: Update wire
on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-wire
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser
      - run: python3 tools/update_wire.py
      - name: Commit changes
        run: |
          git config user.name "MT Post News Wire"
          git config user.email "actions@users.noreply.github.com"
          git add data.json tools/last_run.json
          git diff --staged --quiet || git commit -m "Update wire $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
